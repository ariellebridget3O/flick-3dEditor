<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flick 3D Stage — offline editor</title>
  <link rel="stylesheet" href="css/app.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js",
      "three/addons/": "./js/vendor/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">3D Stage</div>
      <input id="sceneName" class="scene-name" value="Scene 1" spellcheck="false"/>
      <div class="spacer"></div>
      <button id="btnScenes" class="ghost">Scenes…</button>
      <button id="btnSave" class="ghost">Save</button>
      <input type="file" id="fileInput" accept=".json" hidden/>
    </div>
    <div class="stage-header">
      <button id="btnLight" class="light-btn">☀ Light</button>
      <div class="spacer"></div>
      <button id="btnPlay" class="primary">▶ Rehearse</button>
      <div class="seg" id="viewSwitch">
        <button data-v="editor" class="on">Scene</button>
        <button data-v="cameras">Cameras</button>
      </div>
      <div class="seg" id="planSwitch">
        <button data-pm="3d" class="on">3D</button>
        <button data-pm="plan">2D</button>
      </div>
    </div>
    <div class="workspace">
      <div class="viewport-area">
        <div id="viewport" data-testid="stage-canvas-host"></div>
        <div id="frameGuide" class="frame-guide" style="display:none"></div>
        <div id="editToolbar" class="edit-toolbar" style="display:none">
          <button data-tool="translate" title="Move (Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 3 9 3 3 9 3 9 5"/><polyline points="19 5 21 5 21 11 15 11 15 9"/><polyline points="5 15 3 15 3 21 9 21 9 19"/><polyline points="19 19 21 19 21 13 15 13 15 15"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></button>
          <button data-tool="rotate" title="Rotate (X)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
          <button data-tool="scale" title="Scale (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
          <span class="tb-div"></span>
          <button data-tool="delete" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        </div>
        <div id="toast" class="toast" style="display:none"></div>
        <div id="lassoBox" class="lasso-box" style="display:none"></div>
        <button id="navBallPad" class="nav-ball-pad" aria-label="Drag to move around the scene" data-onboard-target="nav-ball"></button>
        <div id="rightToolbar" class="right-toolbar">
          <button id="btnActions" class="rt-btn" aria-label="Toggle the actions palette" aria-pressed="false" title="Actions — drag onto objects, people and timeline lanes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2z"/></svg></button>
          <button id="btnLasso" class="rt-btn" aria-label="Lasso select: drag a box" aria-pressed="false" title="Lasso select: drag a box">⭕</button>
          <button id="btnSnap" class="rt-btn" aria-label="Snap to grid (hold Shift to invert)" aria-pressed="false" title="Snap to grid — 0.25 m / 15° (hold Shift to invert)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
        </div>
        <div id="shadeSwitch" class="shade-switch">
          <button data-sm="shaded" class="on">Shaded</button>
          <button data-sm="flat">Flat</button>
          <button data-sm="wireframe">Wire</button>
        </div>
        <div id="camPills" class="cam-pills"></div>
        <div id="camFooter" class="cam-footer" style="display:none">
          <label>Height <input type="range" id="heightSlider" min="0.2" max="12" step="0.1"/> <span id="heightVal"></span></label>
          <label>Lens <input type="range" id="lensSlider" min="0" max="1000" step="1"/> <span id="lensVal"></span></label>
        </div>
      </div>
      <div class="right-dock">
        <div class="dock-panel" id="panelProps">
          <button class="dock-title" data-collapse="panelProps">Properties <span class="chev">▾</span></button>
          <div class="dock-collapsible">
            <div id="inspectorBody" class="dock-body"><div class="hint">Select an object or an action</div></div>
          </div>
        </div>
        <div class="dock-panel" id="panelScene">
          <button class="dock-title" data-collapse="panelScene">Scene <span class="chev">▾</span></button>
          <div class="dock-collapsible">
            <div class="dock-body add-grid">
              <button data-add="humanoid">Human</button>
              <button data-add="simple_figure">Figure</button>
              <button data-add="camera">Camera</button>
              <button data-add="target">Target</button>
              <button data-add="spotlight">Spotlight</button>
              <button data-add="cube">Cube</button>
              <button data-add="sphere">Sphere</button>
              <button data-add="cylinder">Cylinder</button>
              <button data-add="prop" id="btnPropPicker">Props…</button>
            </div>
            <div id="hierarchy" class="dock-body hierarchy"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="timeline" id="timeline">
      <div class="tl-header">
        <span class="tl-title">Show</span>
        <button id="btnAddTrack" class="ghost small">+ Track</button>
        <span class="spacer"></span>
        <span id="timeBadge" class="time-badge">0.00</span>
      </div>
      <div class="tl-body" id="tlBody">
        <div class="tl-ruler" id="tlRuler"></div>
        <div class="tl-lanes" id="tlLanes"></div>
      </div>
    </div>
    <div id="propPicker" class="modal" style="display:none">
      <div class="modal-box">
        <div class="modal-head">Props <button id="propClose" class="ghost small">✕</button></div>
        <input id="propSearch" class="prop-search" placeholder="Search props…"/>
        <div id="propCats" class="prop-cats"></div>
        <div id="propList" class="prop-list"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import { boot } from './js/main.js';
    import { buildUI } from './js/ui.js';
    import { createPalette, installActionDrop } from './js/palette.js';
    const app = await boot(document.getElementById('viewport'));
    buildUI(app);
    createPalette(app);          // r8: the Actions window (M5r port)
    installActionDrop(app);      // r8: viewport action-drop (BUr port)
    window.__app = app;   // test hook
    const p = new URLSearchParams(location.search);
    if (p.get('scene')) {
      try {
        const data = await (await fetch(p.get('scene'))).json();
        await app.loadSceneData(data);
      } catch (e) { console.warn('sample load failed', e); }
    } else if (!p.get('noAutosave')) {
      app.restoreAutosave();   // resume last session
    }
  </script>
</body>
</html>
